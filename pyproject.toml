[project]
name = "strbcrypt"
dynamic = ["version"]
description = "Codec library for hashing password inputs as string"
readme = "README.md"
authors = [
    { name = "Vizonex", email = "VizonexBusiness@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
]

[build-system]
requires = ["setuptools"]

[tool.setuptools.dynamic]
version = {attr = "strbcrypt.__version__"}


[project.optional-dependencies]
anyio = [
    "anyio>=4.14.2",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
    'uvloop; platform_system != "Windows"',
    'winloop>=0.6.3; platform_system == "Windows"',
    "rsloop>=0.1.30"
]

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "RUF"
]
